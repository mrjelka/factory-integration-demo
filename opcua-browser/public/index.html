<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPC UA Browser</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e17;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #2a3550;
    --text: #e2e8f0;
    --text-dim: #8892a8;
    --accent: #38bdf8;
    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;
    --violet: #a78bfa;
    --font-mono: 'JetBrains Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 14px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }

  .header-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .header h1 {
    font-family: var(--font-mono);
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .header .sub {
    color: var(--text-dim);
    font-size: 12px;
    font-family: var(--font-mono);
  }

  .status-pill {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 6px;
    background: var(--surface2);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .status-pill.ok { color: var(--green); border-color: var(--green); }
  .status-pill.bad { color: var(--red); border-color: var(--red); }

  .layout {
    flex: 1;
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 14px;
    min-height: 0;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .panel-title {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-body {
    flex: 1;
    overflow: auto;
    padding: 8px 4px;
  }

  .panel-body::-webkit-scrollbar { width: 8px; height: 8px; }
  .panel-body::-webkit-scrollbar-track { background: transparent; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Tree */
  .tree-node {
    font-family: var(--font-mono);
    font-size: 12.5px;
    user-select: none;
  }

  .tree-row {
    display: flex;
    align-items: center;
    padding: 3px 8px 3px 4px;
    cursor: pointer;
    border-radius: 4px;
    gap: 4px;
    line-height: 1.4;
    white-space: nowrap;
  }

  .tree-row:hover { background: var(--surface2); }
  .tree-row.selected { background: rgba(56, 189, 248, 0.15); color: var(--accent); }

  .tree-toggle {
    width: 14px;
    flex-shrink: 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 10px;
  }

  .tree-toggle.empty { visibility: hidden; }

  .tree-icon {
    width: 16px;
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
  }
  .tree-icon.Object { color: var(--accent); }
  .tree-icon.Variable { color: var(--green); }
  .tree-icon.Method { color: var(--violet); }
  .tree-icon.ObjectType, .tree-icon.VariableType { color: var(--amber); }
  .tree-icon.DataType { color: var(--text-dim); }
  .tree-icon.ReferenceType { color: var(--text-dim); }

  .tree-children { display: none; }
  .tree-children.open { display: block; }

  .tree-loading {
    padding: 4px 24px;
    font-size: 11px;
    color: var(--text-dim);
    font-style: italic;
  }

  .tree-error {
    padding: 4px 24px;
    font-size: 11px;
    color: var(--red);
  }

  /* Details */
  .details-empty {
    text-align: center;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 60px 20px;
  }

  .attr-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--font-mono);
    font-size: 12.5px;
  }

  .attr-table tr {
    border-bottom: 1px solid var(--border);
  }
  .attr-table tr:last-child { border-bottom: none; }

  .attr-table td {
    padding: 9px 16px;
    vertical-align: top;
    word-break: break-word;
  }

  .attr-table td.key {
    color: var(--text-dim);
    width: 180px;
    font-weight: 600;
  }

  .attr-table td.val {
    color: var(--text);
  }

  .attr-table td.val.empty {
    color: var(--text-dim);
    font-style: italic;
  }

  .value-block {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin: 14px 16px 4px;
    font-family: var(--font-mono);
  }

  .value-block .vlabel {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .value-block .vval {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    word-break: break-all;
  }
  .value-block .vmeta {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 600;
    background: var(--surface2);
    color: var(--text-dim);
    border: 1px solid var(--border);
    margin-left: 6px;
  }
  .badge.Object { color: var(--accent); border-color: var(--accent); }
  .badge.Variable { color: var(--green); border-color: var(--green); }
  .badge.Method { color: var(--violet); border-color: var(--violet); }

  .toolbar {
    display: flex;
    gap: 8px;
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
  }

  .toolbar input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .toolbar input:focus { outline: none; border-color: var(--accent); }

  .toolbar button {
    font-family: var(--font-mono);
    font-size: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  .toolbar button:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">&#128279;</div>
  <div>
    <h1>OPC UA Browser</h1>
    <div class="sub" id="endpoint">connecting&hellip;</div>
  </div>
  <div class="status-pill" id="status">offline</div>
</div>

<div class="layout">
  <div class="panel">
    <div class="panel-title">
      <span>Address Space</span>
    </div>
    <div class="panel-body" id="tree"></div>
    <div class="toolbar">
      <input id="goto" placeholder="NodeId (e.g. ns=1;s=Printer.Status)" />
      <button onclick="gotoNode()">Read</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title" id="detail-title">Node Details</div>
    <div class="panel-body" id="details">
      <div class="details-empty">Select a node from the tree to inspect its attributes.</div>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
const ROOT_NODE = "i=84";

let selectedNodeId = null;
let refreshTimer = null;

async function api(path) {
  const res = await fetch(API + path);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || res.statusText);
  }
  return res.json();
}

function iconFor(nodeClass) {
  switch (nodeClass) {
    case "Object": return "O";
    case "Variable": return "V";
    case "Method": return "M";
    case "ObjectType": return "OT";
    case "VariableType": return "VT";
    case "DataType": return "D";
    case "ReferenceType": return "R";
    case "View": return "W";
    default: return "?";
  }
}

function makeRow(node, depth) {
  const wrap = document.createElement("div");
  wrap.className = "tree-node";

  const row = document.createElement("div");
  row.className = "tree-row";
  row.style.paddingLeft = (4 + depth * 14) + "px";
  row.dataset.nodeId = node.nodeId;
  row.dataset.nodeClass = node.nodeClass;

  const toggle = document.createElement("span");
  toggle.className = "tree-toggle";
  toggle.textContent = "+";

  const icon = document.createElement("span");
  icon.className = "tree-icon " + node.nodeClass;
  icon.textContent = iconFor(node.nodeClass);

  const label = document.createElement("span");
  label.className = "tree-label";
  label.textContent = node.displayName || node.browseName;

  row.appendChild(toggle);
  row.appendChild(icon);
  row.appendChild(label);

  const childrenWrap = document.createElement("div");
  childrenWrap.className = "tree-children";

  let loaded = false;
  let loading = false;

  async function expand() {
    if (loaded || loading) {
      childrenWrap.classList.add("open");
      toggle.textContent = "-";
      return;
    }
    loading = true;
    toggle.textContent = "...";
    childrenWrap.innerHTML = '<div class="tree-loading">loading&hellip;</div>';
    childrenWrap.classList.add("open");
    try {
      const data = await api("/api/browse?nodeId=" + encodeURIComponent(node.nodeId));
      childrenWrap.innerHTML = "";
      if (!data.children.length) {
        toggle.classList.add("empty");
        toggle.textContent = "";
      } else {
        for (const child of data.children) {
          childrenWrap.appendChild(makeRow(child, depth + 1));
        }
        toggle.textContent = "-";
      }
      loaded = true;
    } catch (err) {
      childrenWrap.innerHTML = '<div class="tree-error">' + err.message + '</div>';
      toggle.textContent = "+";
    } finally {
      loading = false;
    }
  }

  function collapse() {
    childrenWrap.classList.remove("open");
    toggle.textContent = "+";
  }

  toggle.addEventListener("click", (e) => {
    e.stopPropagation();
    if (childrenWrap.classList.contains("open")) collapse();
    else expand();
  });

  row.addEventListener("click", () => {
    selectNode(row, node);
    if (!loaded && !loading) expand();
  });

  wrap.appendChild(row);
  wrap.appendChild(childrenWrap);
  return wrap;
}

function selectNode(rowEl, node) {
  document.querySelectorAll(".tree-row.selected").forEach((el) =>
    el.classList.remove("selected"),
  );
  rowEl.classList.add("selected");
  loadDetails(node.nodeId, node);
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function renderValueBlock(attrs) {
  if (attrs.NodeClass !== "Variable" || attrs.Value === null || attrs.Value === undefined) {
    return "";
  }
  let display;
  if (typeof attrs.Value === "object") {
    display = JSON.stringify(attrs.Value);
  } else {
    display = String(attrs.Value);
  }
  return `
    <div class="value-block">
      <div class="vlabel">Live Value</div>
      <div class="vval">${escapeHtml(display)}</div>
      <div class="vmeta">
        <span>type: ${escapeHtml(attrs.ValueDataType || attrs.DataType || "?")}</span>
        ${attrs.SourceTimestamp ? `<span>source: ${escapeHtml(attrs.SourceTimestamp.substr(11, 12))}</span>` : ""}
      </div>
    </div>
  `;
}

function renderAttrTable(attrs) {
  const order = [
    "NodeId",
    "NodeClass",
    "BrowseName",
    "DisplayName",
    "Description",
    "DataType",
    "ValueRank",
    "AccessLevel",
    "UserAccessLevel",
    "Value",
  ];
  const rows = order
    .map((k) => {
      const v = attrs[k];
      const empty = v === null || v === undefined || v === "";
      const displayVal = empty
        ? "&mdash;"
        : typeof v === "object"
          ? JSON.stringify(v)
          : escapeHtml(v);
      return `<tr><td class="key">${k}</td><td class="val ${empty ? "empty" : ""}">${displayVal}</td></tr>`;
    })
    .join("");
  return `<table class="attr-table">${rows}</table>`;
}

async function loadDetails(nodeId, hint) {
  selectedNodeId = nodeId;
  const titleEl = document.getElementById("detail-title");
  const detailsEl = document.getElementById("details");

  titleEl.innerHTML = `Node Details${hint ? ` <span class="badge ${hint.nodeClass}">${hint.nodeClass}</span>` : ""}`;

  if (refreshTimer) clearInterval(refreshTimer);

  async function refresh() {
    if (selectedNodeId !== nodeId) return;
    try {
      const data = await api("/api/read?nodeId=" + encodeURIComponent(nodeId));
      if (selectedNodeId !== nodeId) return;
      detailsEl.innerHTML =
        renderValueBlock(data.attributes) + renderAttrTable(data.attributes);
    } catch (err) {
      detailsEl.innerHTML = `<div class="details-empty" style="color: var(--red)">${escapeHtml(err.message)}</div>`;
    }
  }

  await refresh();
  refreshTimer = setInterval(refresh, 1000);
}

async function gotoNode() {
  const nodeId = document.getElementById("goto").value.trim();
  if (!nodeId) return;
  document.querySelectorAll(".tree-row.selected").forEach((el) =>
    el.classList.remove("selected"),
  );
  loadDetails(nodeId, null);
}

document.getElementById("goto").addEventListener("keydown", (e) => {
  if (e.key === "Enter") gotoNode();
});

async function init() {
  const treeEl = document.getElementById("tree");
  treeEl.innerHTML = '<div class="tree-loading">connecting&hellip;</div>';

  // Health
  try {
    const h = await api("/api/health");
    document.getElementById("endpoint").textContent = h.endpoint;
    const pill = document.getElementById("status");
    if (h.connected) {
      pill.textContent = "connected";
      pill.classList.add("ok");
    } else {
      pill.textContent = "connecting";
      pill.classList.add("bad");
      // Retry shortly
      setTimeout(init, 2000);
      return;
    }
  } catch (e) {
    setTimeout(init, 2000);
    return;
  }

  // Load root
  try {
    const data = await api("/api/browse?nodeId=" + encodeURIComponent(ROOT_NODE));
    treeEl.innerHTML = "";
    const rootNode = {
      nodeId: ROOT_NODE,
      browseName: "Root",
      displayName: "Root",
      nodeClass: "Object",
    };
    const rootRow = makeRow(rootNode, 0);
    treeEl.appendChild(rootRow);
    // Expand Root automatically
    rootRow.querySelector(".tree-toggle").click();
  } catch (err) {
    treeEl.innerHTML = `<div class="tree-error">${escapeHtml(err.message)}</div>`;
  }
}

init();
</script>

</body>
</html>
